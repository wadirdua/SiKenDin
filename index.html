<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SiKenDin – Kendaraan Dinas Poltekkes Kemenkes Jayapura</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#f4f7f6;--card:#fff;--tx:#17302b;--mut:#5b6f6a;--ac:#0f766e;--acx:#fff;--bd:#d9e3e0}
@media (prefers-color-scheme:dark){:root{--bg:#10201d;--card:#172a26;--tx:#e6f1ee;--mut:#9db3ad;--ac:#2dd4bf;--acx:#06201b;--bd:#27403a}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:28px 24px;max-width:420px;width:100%;text-align:center}
h1{font-size:1.5rem;margin:0 0 4px}
.s{color:var(--mut);margin:0 0 20px;font-size:.95rem}
a.b{display:block;background:var(--ac);color:var(--acx);text-decoration:none;font-weight:600;padding:14px;border-radius:10px;font-size:1.05rem}
.n{color:var(--mut);font-size:.85rem;margin-top:16px;line-height:1.5}
.w{display:none;background:#fef3c7;color:#78350f;border-radius:8px;padding:10px;font-size:.85rem;margin-bottom:14px}
</style>
</head>
<body>
<main class="c">
  <h1>SiKenDin</h1>
  <p class="s">Servis berkala &amp; buku peminjaman kendaraan dinas<br>Poltekkes Kemenkes Jayapura</p>
  <div class="w" id="w">Alamat aplikasi belum diisi. Ubah konstanta <b>WEBAPP_URL</b> di file ini.</div>
  <a class="b" id="go" href="#">Buka SiKenDin</a>
  <p class="n">Masuk dengan akun Google yang sudah didaftarkan admin. Jika diminta izin pada kunjungan pertama, pilih <i>Izinkan</i>.</p>
</main>
<script>
// Isi dengan alamat web app Apps Script (berakhiran /exec)
const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbyUEoYuFVA5e_dMyp5uvbWimbl2luevRSAVK_Gx5ydgZbkSYWmVkC0v5gagLUbSKosx/exec";

const go = document.getElementById("go");
if (WEBAPP_URL) { go.href = WEBAPP_URL; }
else { document.getElementById("w").style.display = "block"; go.style.opacity = ".5"; go.style.pointerEvents = "none"; }
</script>
</body>
</html>

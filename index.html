<!DOCTYPE html>
<html lang="id">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SiKenDin</title>
<style>
:root{--bg:#f3f6f5;--card:#fff;--ink:#16292c;--mut:#5f7377;--line:#d5dfde;--pri:#0f6b68;--warn:#a8650a;--warnbg:#fbefd9;--bad:#a72f27;--badbg:#f8e0dd;--ok:#1d6b3a;--okbg:#dff1e5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,sans-serif}
header{padding:14px 16px 4px;max-width:760px;margin:auto;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
header h1{margin:0;font-size:1.3rem}header p{margin:0;color:var(--mut);font-size:.85rem}
nav{display:flex;gap:4px;max-width:760px;margin:auto;padding:8px 16px;position:sticky;top:0;background:var(--bg);z-index:5}
nav button{flex:1;padding:10px 2px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;border-radius:8px;cursor:pointer}
nav button[aria-selected=true]{background:var(--pri);color:#fff;border-color:var(--pri)}
main{max-width:760px;margin:auto;padding:8px 16px 48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.plat{font-weight:700;font-size:1.05rem;letter-spacing:.04em}.mut{color:var(--mut);font-size:.88rem}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.78rem;font-weight:700;white-space:nowrap}
.ok{background:var(--okbg);color:var(--ok)}.warn{background:var(--warnbg);color:var(--warn)}.bad{background:var(--badbg);color:var(--bad)}
.bar{height:6px;background:var(--line);border-radius:4px;margin:8px 0 4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}
button.b{font:inherit;font-weight:600;padding:9px 14px;border-radius:8px;border:1px solid var(--pri);background:var(--pri);color:#fff;cursor:pointer}
button.g{background:transparent;color:var(--pri)}button.d{background:transparent;color:var(--bad);border-color:var(--line)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
label{display:block;font-size:.85rem;font-weight:600;margin:10px 0 3px}
input,select,textarea{width:100%;font:inherit;padding:9px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
h2{font-size:1.05rem;margin:16px 0 8px}
.empty{padding:22px;text-align:center;color:var(--mut);border:1px dashed var(--line);border-radius:10px}
.top{display:flex;justify-content:space-between;align-items:center;margin:4px 0 10px}
.th{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.th a,.th span{width:76px;height:76px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--bg);display:block}
.th img{width:100%;height:100%;object-fit:cover}
#busy{position:fixed;inset:0;background:rgba(255,255,255,.8);display:flex;align-items:center;justify-content:center;z-index:50;font-weight:600}
#busy[hidden]{display:none}
#ba{position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:20;padding:0 12px 40px}#ba[hidden]{display:none}
.tool{max-width:760px;margin:10px auto;display:flex;gap:6px;flex-wrap:wrap}
.paper{background:#fff;color:#000;max-width:760px;margin:auto;padding:32px 28px;font:14px/1.55 "Times New Roman",serif;border:1px solid var(--line)}
.paper h3{text-align:center;margin:0;font-size:1.05rem;text-decoration:underline}.paper .nm{text-align:center;margin-bottom:14px}
.paper table{border-collapse:collapse;width:100%;margin:6px 0}.paper td{padding:2px 4px;vertical-align:top}.paper td:first-child{width:34%}
.paper ol{margin:4px 0;padding-left:20px}
.sig{display:grid;grid-template-columns:1fr 1fr;gap:20px;text-align:center;margin-top:22px}.sig div{min-height:110px}
.kop{border-bottom:3px double #000;padding-bottom:6px;margin-bottom:14px}.kop img{display:block;width:100%;height:auto}
.vrow{display:flex;gap:12px;align-items:flex-start}.vb{flex:1;min-width:0}
.vp{flex:0 0 112px;width:112px;height:84px;border-radius:8px;overflow:hidden;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:.72rem;color:var(--mut);text-align:center;text-decoration:none}
.vp img{width:100%;height:100%;object-fit:cover}
img:not([src]){visibility:hidden}
.v4{flex:0 0 140px;width:140px;display:grid;grid-template-columns:1fr 1fr;gap:3px;text-decoration:none;cursor:pointer}
.v4 i{position:relative;display:flex;align-items:center;justify-content:center;aspect-ratio:4/3;border-radius:6px;overflow:hidden;background:var(--bg);border:1px solid var(--line);font-style:normal}
.v4 i img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.v4 b{position:absolute;left:0;bottom:0;background:rgba(0,0,0,.6);color:#fff;font-size:.58rem;font-weight:600;padding:0 5px;border-top-right-radius:5px}
.sisi{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sisi .pv{aspect-ratio:4/3;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:.75rem;color:var(--mut);margin-bottom:6px;position:relative}
.sisi .pv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sisi input[type=file]{font-size:.8rem;padding:6px}
@media (max-width:420px){.vp{flex-basis:84px;width:84px;height:68px}.v4{flex-basis:112px;width:112px}}
@media print{body>*:not(#ba){display:none!important}#ba{position:static;overflow:visible;padding:0}.tool{display:none}.paper{border:0;padding:0;max-width:none}}
#login{position:fixed;inset:0;z-index:99;background:Canvas;color:CanvasText;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}#login[hidden],#pw[hidden]{display:none}#pw{position:fixed;inset:0;z-index:98;background:Canvas;color:CanvasText;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}#login h2{margin:0}#login p{margin:0;max-width:340px;opacity:.75;font-size:.9rem}
</style>
</head>
<body>
<header><div><h1>SiKenDin</h1><p>Kendaraan dinas · Poltekkes Kemenkes Jayapura</p></div><div style="text-align:right"><p id="who"></p><button class="b g" style="padding:4px 10px" onclick="init()">Muat ulang</button><button class="b g" style="padding:4px 10px;margin-left:4px" onclick="$('#pw').hidden=false">Ganti sandi</button><button class="b g" style="padding:4px 10px;margin-left:4px" onclick="logout()">Keluar</button></div></header>
<nav id="nav"></nav>
<main id="m"></main>
<section id="ba" hidden></section>
<div id="login" hidden onkeydown="if(event.key==='Enter')doLogin()"><h2>SiKenDin</h2><p>Masuk dengan username dan kata sandi dari admin.</p><input id="lu" placeholder="Username" autocomplete="username" autocapitalize="none" style="max-width:300px;width:100%"><input id="lp" type="password" placeholder="Kata sandi" autocomplete="current-password" style="max-width:300px;width:100%"><button class="b" id="lbtn" style="max-width:300px;width:100%" onclick="doLogin()">Masuk</button><p id="lmsg"></p></div>
<div id="pw" hidden class="ov" onkeydown="if(event.key==='Enter')doPw()"><h2>Ganti kata sandi</h2><input id="pw1" type="password" placeholder="Kata sandi lama" autocomplete="current-password" style="max-width:300px;width:100%"><input id="pw2" type="password" placeholder="Kata sandi baru (min. 8 karakter)" autocomplete="new-password" style="max-width:300px;width:100%"><div style="display:flex;gap:8px"><button class="b" onclick="doPw()">Simpan</button><button class="b g" onclick="$('#pw').hidden=true">Batal</button></div><p id="pmsg"></p></div>
<div id="busy" hidden><span id="bt">Memuat…</span></div>
<script>
window.onerror=function(msg,src,line){
  var e=document.getElementById('m');if(!e)return;
  e.innerHTML='<div class="empty" style="text-align:left;word-break:break-all">Terjadi kesalahan: '+String(msg).replace(/&/g,'&amp;').replace(/</g,'&lt;')+' (baris '+line+')</div>';
};
</script>

/* Petugas penandatangan (Pihak Pertama). Ubah daftar ini bila petugas tetap berganti. */
const PETUGAS=[
  {nama:'Oktovianus Menasererey, A.Md.Pd',nip:'198212312025211153',jab:'PJ Kendaraan'},
  {nama:'Aldo George Wattimena, S.Kom',nip:'199706142025211060',jab:'Operator BMN'}
];
function selPetugas(p,cur){
  cur=cur||{};
  const idx=cur.nip?PETUGAS.findIndex(x=>x.nip===cur.nip):-1,manual=!!cur.nama&&idx<0;
  const o=PETUGAS.map((x,i)=>`<option value="${i}"${(i===idx||(!cur.nama&&i===0))?' selected':''}>${esc(x.nama)} \u2013 NIP ${esc(x.nip)} \u2013 ${esc(x.jab)}</option>`).join('')+`<option value="x"${manual?' selected':''}>Pejabat lain / pengganti (isi manual)</option>`;
  return`<select id="${p}s" onchange="petChg('${p}')">${o}</select><div class="mut" id="${p}k" style="margin-top:4px"></div>
  <div id="${p}m" hidden><label>Nama pejabat pengganti</label><input id="${p}n" value="${esc(manual?cur.nama:'')}"><div class="g2"><div><label>NIP</label><input id="${p}i" value="${esc(manual?cur.nip:'')}"></div><div><label>Jabatan</label><input id="${p}j" value="${esc(manual?cur.jab:'')}" placeholder="mis. Plh. PJ Kendaraan"></div></div></div>`;
}
function petChg(p){
  const v=$('#'+p+'s').value;
  $('#'+p+'m').hidden=v!=='x';
  $('#'+p+'k').textContent=v==='x'?'':'NIP '+PETUGAS[+v].nip+' \u00b7 '+PETUGAS[+v].jab;
}
function petVal(p){
  const v=$('#'+p+'s').value;
  if(v==='x'){
    const o={nama:$('#'+p+'n').value.trim(),nip:$('#'+p+'i').value.trim(),jab:$('#'+p+'j').value.trim()};
    if(!o.nama||!o.jab){alert('Isi nama dan jabatan pejabat pengganti.');return null}
    return o;
  }
  return PETUGAS[+v];
}
const SISI=['Depan','Belakang','Kiri','Kanan'];
const fotos=v=>{const a=String(v.foto||'').split(',');return [0,1,2,3].map(i=>a[i]||'')};
const fp=v=>{const f=fotos(v);if(!f.some(Boolean))return`<div class='vp'>Belum ada foto</div>`;
return`<a class='v4' href='#' data-v='${esc(v.id)}' onclick='lihatV(this.dataset.v);return false'>`+f.map((id,k)=>`<i>${id?`<img data-fid='${esc(id)}' alt='${SISI[k]}'>`:''}<b>${SISI[k]}</b></i>`).join('')+`</a>`};

/* ---- Pemuat foto: lewat server (base64), per kelompok kecil ---- */
const IMG={};
function loadImgs(){
  var els=[].slice.call(document.querySelectorAll('img[data-fid]')),need=[];
  els.forEach(function(e){
    var id=e.dataset.fid;
    if(IMG[id])e.src=IMG[id];
    else if(need.indexOf(id)<0)need.push(id);
  });
  if(!need.length)return;
  var chunks=[];for(var i=0;i<need.length;i+=5)chunks.push(need.slice(i,i+5));
  chunks.forEach(function(ch){
    gs('getFotoBatch',ch).then(function(m){
      Object.keys(m||{}).forEach(function(k){IMG[k]=m[k]});
      els.forEach(function(e){
        var id=e.dataset.fid;
        if(ch.indexOf(id)<0)return;
        e.src=IMG[id]||NOFOTO;
      });
    }).catch(function(err){
      console.log(err);
      els.forEach(function(e){if(ch.indexOf(e.dataset.fid)>=0&&!e.getAttribute('src'))e.src=NOFOTO});
    });
  });
}
function closeBa(){$('#ba').hidden=true}
function lihat(id){
  var e=$('#ba');e.hidden=false;
  e.innerHTML='<div class=\'tool\'><button class=\'b g\' onclick=\'closeBa()\'>Tutup</button><button class=\'b g\' data-f=\''+esc(id)+'\' onclick=\'window.open(vurl(this.dataset.f))\'>Buka di Drive</button></div><div id=\'lb\' style=\'text-align:center;max-width:760px;margin:auto\'>Memuat foto...</div>';
  gs('getFoto',id,false).then(function(s){
    var l=$('#lb');l.innerHTML='';
    var im=document.createElement('img');im.src=s;im.style.maxWidth='100%';l.appendChild(im);
  }).catch(function(err){
    $('#lb').textContent='Foto tidak bisa dimuat: '+((err&&err.message)||err);
  });
}
function lihatV(vid){
  var v=V(vid),f=fotos(v),e=$('#ba');e.hidden=false;
  var h='<div class=\'tool\'><button class=\'b g\' onclick=\'closeBa()\'>Tutup</button></div><div style=\'max-width:760px;margin:auto\'><h2>'+esc(v.plat)+' \u00b7 '+esc(v.nama)+'</h2>';
  f.forEach(function(id,k){h+='<div class=\'card\'><b>'+SISI[k]+'</b>'+(id?'<div id=\'lv'+k+'\' class=\'mut\' style=\'text-align:center;margin-top:6px\'>Memuat foto...</div>':'<div class=\'mut\'>Belum ada foto</div>')+'</div>'});
  e.innerHTML=h+'</div>';
  f.forEach(function(id,k){
    if(!id)return;
    gs('getFoto',id,false).then(function(s){var l=$('#lv'+k);l.innerHTML='';var im=document.createElement('img');im.src=s;im.style.maxWidth='100%';l.appendChild(im)})
    .catch(function(err){$('#lv'+k).textContent='Foto tidak bisa dimuat: '+((err&&err.message)||err)});
  });
}
function actU(v){
  if(!canU())return'';
  var h='<div class=\'acts\'><button class=\'b\' onclick=\'fFoto(this.dataset.i)\' data-i=\''+v.id+'\'>Ubah foto</button>';
  h+='<button class=\'b g\' onclick=\'lkOpen(this.dataset.i)\' data-i=\''+v.id+'\'>Perlengkapan</button>';
  h+='<button class=\'b g\' onclick=\'fUnit(this.dataset.i)\' data-i=\''+v.id+'\'>Ubah data</button>';
  if(can())h+='<button class=\'b d\' onclick=\'delV(this.dataset.i)\' data-i=\''+v.id+'\'>Hapus</button>';
  return h+'</div>';
}

/* ---- Koneksi ke backend + login ----
   Dibuka dari URL Apps Script: memakai google.script.run. Dibuka dari GitHub Pages: isi CFG.API_URL (URL web app /exec). */
const CFG={API_URL:'https://script.google.com/macros/s/AKfycbzr8U2vHP0VBmEx3JTY3OVDMGepQajeoP50_wpZ50z3v_5BY4dRX1k5M16UvcmJOhwN/exec'};
const ON_GAS=typeof google!=='undefined'&&!!google.script&&!!google.script.run;
let TOKEN=sessionStorage.getItem('sk_t')||'',waiters=[],LMSG='';
const tokExp=t=>{try{return JSON.parse(atob(t.split('.')[0].replace(/-/g,'+').replace(/_/g,'/'))).exp}catch(e){return 0}};
function send(req){
  if(ON_GAS)return new Promise((ok,no)=>google.script.run.withSuccessHandler(ok).withFailureHandler(e=>no(e)).rpc(req));
  if(!CFG.API_URL)return Promise.reject(new Error('CFG.API_URL belum diisi di index.html.'));
  return fetch(CFG.API_URL,{method:'POST',body:JSON.stringify(req)}).then(r=>r.json());
}
function tok(){
  if(TOKEN&&tokExp(TOKEN)>Date.now()+60000)return Promise.resolve(TOKEN);
  return new Promise(ok=>{waiters.push(ok);showLogin()});
}
function showLogin(){$('#busy').hidden=true;$('#login').hidden=false;$('#lmsg').textContent=LMSG;LMSG='';setTimeout(()=>$('#lu').focus(),50)}
async function doLogin(){
  const u=$('#lu').value.trim(),p=$('#lp').value;
  if(!u||!p){$('#lmsg').textContent='Isi username dan kata sandi.';return}
  $('#lbtn').disabled=true;$('#lmsg').textContent='Memeriksa\u2026';
  try{
    const j=await send({fn:'login',args:[u,p]});
    if(!j.ok)throw new Error(j.error);
    TOKEN=j.data.token;sessionStorage.setItem('sk_t',TOKEN);$('#lp').value='';$('#login').hidden=true;$('#lmsg').textContent='';
    waiters.splice(0).forEach(f=>f(TOKEN));
  }catch(e){$('#lmsg').textContent=(e&&e.message)||String(e)}
  finally{$('#lbtn').disabled=false}
}
function logout(){sessionStorage.removeItem('sk_t');TOKEN='';location.reload()}
async function doPw(){
  const a=$('#pw1').value,b=$('#pw2').value;
  if(!a||b.length<8){$('#pmsg').textContent='Isi kata sandi lama dan kata sandi baru (min. 8 karakter).';return}
  try{await run(()=>gs('ubahSandi',a,b));$('#pw').hidden=true;$('#pw1').value='';$('#pw2').value='';$('#pmsg').textContent='';alert('Kata sandi berhasil diganti.')}
  catch(e){$('#pmsg').textContent=(e&&e.message)||String(e)}
}
async function api(fn,args){
  const t=await tok();
  let j;
  try{j=await send({token:t,fn:fn,args:args})}
  catch(e){throw new Error((e&&e.message)||'Tidak dapat terhubung ke server. Periksa koneksi internet.')}
  if(!j.ok){
    if(j.code==='AUTH'){sessionStorage.removeItem('sk_t');TOKEN='';LMSG=j.error;return api(fn,args)}
    throw new Error(j.error||'Kesalahan server');
  }
  return j.data;
}
const gs=(fn,...a)=>api(fn,a);
const run=async(p,t)=>{busy(1,t||'Menyimpan\u2026');try{return await p()}catch(e){alert('Gagal: '+(e.message||e));throw e}finally{busy(0)}};
async function put(table,obj,arr){const r=await gs('save',table,obj);const k=Object.keys(r)[0];const i=D[arr].findIndex(x=>x[k]===r[k]);i>=0?D[arr][i]=r:D[arr].push(r);return r}

async function init(){
  busy(1,'Memuat data\u2026');
  try{
    const r=await gs('boot');
    if(!r||!r.me)throw new Error('Server tidak mengembalikan data. Pastikan setup() sudah dijalankan dan deployment memakai versi terbaru.');
    D=r;$('#who').textContent=D.me.nama+' \u00b7 '+D.me.peran;render();
  }catch(e){$('#m').innerHTML='<div class="empty">Gagal memuat: '+esc((e&&e.message)||e)+'</div>'}
  finally{busy(0)}
}
function render(){
  const t=[['servis','Servis'],['pinjam','Pinjam'],['unit','Kendaraan']];if(D.me.peran==='admin')t.push(['user','Pengguna']);
  $('#nav').innerHTML=t.map(([k,n])=>`<button data-t="${k}" aria-selected="${k===tab}" onclick="tab='${k}';render()">${n}</button>`).join('');
  $('#m').innerHTML=({servis:rServis,pinjam:rPinjam,unit:rUnit,user:rUser})[tab]();
  loadImgs();
}

/* ---- Servis ---- */
function due(v){
  const last=D.s.filter(s=>s.vid===v.id).sort((a,b)=>b.tgl.localeCompare(a.tgl))[0];
  const bk=last?+last.km:+v.kmAwal,bt=last?last.tgl:(v.tglServis||today());
  const nk=bk+ +v.intKm,nt=addM(bt,+v.intBln),sisaKm=nk-(+v.km),sisaHr=days(nt);
  let st='ok',tx='Aman';
  if(sisaKm<=0||sisaHr<0){st='bad';tx='Lewat jadwal'}else if(sisaKm<=500||sisaHr<=14){st='warn';tx='Segera servis'}
  return{last,nk,nt,sisaKm,sisaHr,st,tx,pct:Math.min(100,Math.max(0,100-sisaKm/ +v.intKm*100))};
}
const free=v=>!D.l.some(l=>l.vid===v.id&&l.status==='Dipinjam');
function rServis(){
  if(!D.v.length)return'<div class="empty">Belum ada kendaraan.'+(can()?' Tambah di tab Kendaraan.':'')+'</div>';
  const o={bad:0,warn:1,ok:2};
  return D.v.map(v=>({v,d:due(v)})).sort((a,b)=>o[a.d.st]-o[b.d.st]).map(({v,d})=>`<div class="card"><div class="vrow">${fp(v)}<div class="vb"><div class="row"><div><div class="plat">${esc(v.plat)}</div><div class="mut">${esc(v.nama)}${v.unit?' \u00b7 '+esc(v.unit):''}</div></div><span class="tag ${d.st}">${d.tx}</span></div>
  <div class="bar"><i style="width:${d.pct}%"></i></div>
  <div class="mut">Km kini ${nf(v.km)} \u00b7 servis berikut km ${nf(d.nk)} (${d.sisaKm>=0?'sisa '+nf(d.sisaKm):'lewat '+nf(-d.sisaKm)} km)</div>
  <div class="mut">Atau ${fd(d.nt)} (${d.sisaHr>=0?d.sisaHr+' hari lagi':'lewat '+(-d.sisaHr)+' hari'})</div>
  <div class="mut">Terakhir: ${d.last?fd(d.last.tgl)+' \u00b7 '+esc(d.last.jenis):'belum tercatat'}</div>
  <div class="acts">${can()?`<button class="b" onclick="fServis('${v.id}')">Catat servis</button>`:''}<button class="b g" onclick="rwy('${v.id}')">Riwayat</button></div></div></div></div>`).join('');
}
function fServis(vid){
  const v=V(vid);files=[];
  $('#m').innerHTML=`<h2>Catat servis \u00b7 ${esc(v.plat)}</h2><div class="card">
  <div class="g2"><div><label>Tanggal</label><input id="a1" type="date" value="${today()}"></div><div><label>Km saat servis</label><input id="a2" type="number" value="${esc(v.km)}"></div></div>
  <label>Jenis servis</label><select id="a3"><option>Ganti oli &amp; filter</option><option>Servis berkala</option><option>Rem</option><option>Ban / spooring</option><option>Aki / kelistrikan</option><option>Perbaikan lain</option></select>
  <label>Bengkel</label><input id="a4"><label>Biaya (Rp)</label><input id="a5" type="number" inputmode="numeric">
  <label>Keterangan / suku cadang</label><textarea id="a6" rows="2"></textarea>
  <label>Foto servis (nota, kendaraan, suku cadang)</label><input id="a7" type="file" accept="image/*" multiple onchange="pick(this)"><div class="th" id="prev"></div>
  <div class="acts"><button class="b" onclick="sSrv('${vid}')">Simpan servis</button><button class="b g" onclick="render()">Batal</button></div></div>`;
}
function pick(i){files=[...files,...i.files];i.value='';$('#prev').innerHTML=files.map(f=>`<span><img src="${URL.createObjectURL(f)}"></span>`).join('')}
function shrink(f){return new Promise((ok,no)=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.8).split(',')[1])};im.onerror=()=>no(new Error('Gambar tidak bisa dibaca. Coba foto lain.'));im.src=URL.createObjectURL(f)})}
async function sSrv(vid){
  const km=+$('#a2').value;if(!$('#a1').value||!km){alert('Isi tanggal dan km saat servis.');return}
  const f=files.slice(),g=id=>$(id).value,tgl=g('#a1'),jenis=g('#a3'),bengkel=g('#a4'),biaya=g('#a5'),ket=g('#a6');
  try{
    await run(async()=>{
      const ids=[];for(let i=0;i<f.length;i++){busy(1,`Mengunggah foto ${i+1}/${f.length}\u2026`);ids.push(await gs('uploadFoto',await shrink(f[i]),`${V(vid).plat.replace(/\s/g,'_')}_${tgl}_${i+1}.jpg`,'image/jpeg'))}
      busy(1,'Menyimpan\u2026');await put('Servis',{id:uid(),vid,tgl,km,jenis,bengkel,biaya,ket,foto:ids.join(',')},'s');
      const v=V(vid);if(km>+v.km){v.km=km;await put('Kendaraan',v,'v')}
    });
    render();
  }catch(e){}
}
function rwy(vid){
  var v=V(vid);
  var r=D.s.filter(function(s){return s.vid===vid}).sort(function(a,b){return b.tgl.localeCompare(a.tgl)});
  var h='<div class=\'top\'><h2 style=\'margin:0\'>Riwayat \u00b7 '+esc(v.plat)+'</h2>';
  h+='<button class=\'b g\' onclick=\'render()\'>Kembali</button></div>';
  if(!r.length)h+='<div class=\'empty\'>Belum ada riwayat servis.</div>';
  r.forEach(function(s){
    h+='<div class=\'card\'><div class=\'row\'><b>'+esc(s.jenis)+'</b><span class=\'mut\'>'+fd(s.tgl)+'</span></div>';
    h+='<div class=\'mut\'>Km '+nf(s.km)+' \u00b7 '+esc(s.bengkel||'-')+' \u00b7 Rp '+nf(s.biaya)+'</div>';
    if(s.ket)h+='<div class=\'mut\'>'+esc(s.ket)+'</div>';
    if(s.foto)h+='<div class=\'th\' data-f=\''+esc(s.foto)+'\'></div>';
    if(can())h+='<div class=\'acts\'><button class=\'b d\' data-i=\''+s.id+'\' data-v=\''+vid+'\' onclick=\'delS(this.dataset.i,this.dataset.v)\'>Hapus</button></div>';
    h+='</div>';
  });
  $('#m').innerHTML=h;
  document.querySelectorAll('#m .th').forEach(function(box){
    box.dataset.f.split(',').filter(Boolean).forEach(function(id){
      var a=document.createElement('a'),im=document.createElement('img');
      a.href='#';a.onclick=function(){lihat(id);return false};
      im.dataset.fid=id;im.alt='Foto servis';
      a.appendChild(im);box.appendChild(a);
    });
  });
  loadImgs();
}
async function delS(id,vid){if(!confirm('Hapus catatan servis ini?'))return;await run(()=>gs('remove','Servis',id));D.s=D.s.filter(s=>s.id!==id);rwy(vid)}

/* ---- Peminjaman ---- */
function rPinjam(){
  const act=D.l.filter(l=>l.status==='Dipinjam'),done=D.l.filter(l=>l.status!=='Dipinjam').sort((a,b)=>b.tglPinjam.localeCompare(a.tglPinjam));
  const card=l=>{const v=V(l.vid);return`<div class="card"><div class="row"><div><div class="plat">${esc(v.plat||'?')}</div><div class="mut">${esc(l.peminjam)} \u00b7 ${esc(l.unit)}</div></div><span class="tag ${l.status==='Dipinjam'?'warn':'ok'}">${esc(l.status)}</span></div>
  <div class="mut">${esc(l.tujuan)}</div><div class="mut">${fd(l.tglPinjam)} \u2192 ${fd(l.tglRencana)}${l.tglKembali?' (kembali '+fd(l.tglKembali)+')':''}</div>
  <div class="acts">${can()&&l.status==='Dipinjam'?`<button class="b" onclick="fBalik('${l.id}')">Kembalikan</button>`:''}<button class="b g" onclick="ba('${l.id}','pinjam')">BA Peminjaman</button>${l.status==='Kembali'?`<button class="b g" onclick="ba('${l.id}','kembali')">BA Pengembalian</button>`:''}${can()?`<button class="b d" onclick="delL('${l.id}')">Hapus</button>`:''}</div></div>`};
  return`<div class="top"><h2 style="margin:0">Buku peminjaman</h2><button class="b" onclick="fPinjam()">+ Pinjam</button></div>`+
  (act.length?'<h2>Sedang dipinjam</h2>'+act.map(card).join(''):'')+(done.length?'<h2>Riwayat</h2>'+done.map(card).join(''):'')+(D.l.length?'':'<div class="empty">Belum ada peminjaman tercatat.</div>');
}
function fPinjam(){
  const av=D.v.filter(free);if(!av.length){alert('Tidak ada kendaraan tersedia.');return}
  $('#m').innerHTML=`<h2>Peminjaman baru</h2><div class="card"><label>Kendaraan</label><select id="p1">${av.map(v=>`<option value="${v.id}">${esc(v.plat)} \u2013 ${esc(v.nama)} (km ${nf(v.km)})</option>`).join('')}</select>
  <label>Nama peminjam</label><input id="p2" value="${esc(D.me.nama!==D.me.email?D.me.nama:'')}"><div class="g2"><div><label>NIP / NIM</label><input id="p3"></div><div><label>Unit / jurusan</label><input id="p4"></div></div>
  <label>Pengemudi (jika berbeda)</label><input id="p5"><label>Tujuan / keperluan</label><textarea id="p6" rows="2"></textarea>
  <div class="g2"><div><label>Tanggal pinjam</label><input id="p7" type="date" value="${today()}"></div><div><label>Rencana kembali</label><input id="p8" type="date" value="${today()}"></div></div>
  <label>Kondisi saat diserahkan</label><input id="p9" value="Baik, bahan bakar sesuai indikator, kelengkapan lengkap">
  <label>Petugas penyerah (Pihak Pertama)</label>${selPetugas('q1',{})}
  <div class="acts"><button class="b" onclick="sPinjam()">Simpan &amp; buat berita acara</button><button class="b g" onclick="render()">Batal</button></div></div>`;
  petChg('q1');
}
async function sPinjam(){
  const g=i=>$(i).value;if(!g('#p2')||!g('#p6')){alert('Isi nama peminjam dan tujuan.');return}
  const pt=petVal('q1');if(!pt)return;
  const v=V(g('#p1')),o={id:uid(),vid:v.id,peminjam:g('#p2'),nip:g('#p3'),unit:g('#p4'),driver:g('#p5'),tujuan:g('#p6'),tglPinjam:g('#p7'),tglRencana:g('#p8'),kondisi:g('#p9'),kmAwal:v.km,status:'Dipinjam',pj:pt.nama,pjNip:pt.nip,pjJab:pt.jab};
  try{const r=await run(()=>put('Peminjaman',o,'l'));render();ba(r.id,'pinjam')}catch(e){}
}
function fBalik(id){
  const l=D.l.find(x=>x.id===id);
  $('#m').innerHTML=`<h2>Pengembalian \u00b7 ${esc(V(l.vid).plat)}</h2><div class="card"><div class="mut">Peminjam: ${esc(l.peminjam)} \u00b7 km awal ${nf(l.kmAwal)}</div>
  <div class="g2"><div><label>Tanggal kembali</label><input id="r1" type="date" value="${today()}"></div><div><label>Km akhir</label><input id="r2" type="number" value="${esc(l.kmAwal)}"></div></div>
  <label>Kondisi saat kembali</label><input id="r3" value="Baik, tidak ada kerusakan">
  <label>Petugas penerima (Pihak Pertama)</label>${selPetugas('q2',{nama:l.pj,nip:l.pjNip,jab:l.pjJab})}
  <div class="acts"><button class="b" onclick="sBalik('${id}')">Simpan pengembalian</button><button class="b g" onclick="render()">Batal</button></div></div>`;
  petChg('q2');
}
async function sBalik(id){
  const l=D.l.find(x=>x.id===id),ka=+$('#r2').value;if(ka<+l.kmAwal){alert('Km akhir tidak boleh lebih kecil dari km awal.');return}
  const pt=petVal('q2');if(!pt)return;
  const baru=Object.assign({},l,{status:'Kembali',tglKembali:$('#r1').value,kmAkhir:ka,kondisiBalik:$('#r3').value,pjB:pt.nama,pjBNip:pt.nip,pjBJab:pt.jab});
  try{
    await run(async()=>{await put('Peminjaman',baru,'l');const v=V(l.vid);if(ka>+v.km){v.km=ka;await put('Kendaraan',v,'v')}});
    render();ba(id,'kembali');
  }catch(e){}
}
async function delL(id){if(!confirm('Hapus catatan peminjaman ini?'))return;await run(()=>gs('remove','Peminjaman',id));D.l=D.l.filter(l=>l.id!==id);render()}

/* ---- Berita acara (peminjaman & pengembalian) ---- */
function ba(id,jenis){
  const l=D.l.find(x=>x.id===id),v=V(l.vid),c=D.cfg;
  const kb=jenis==='kembali'&&l.status==='Kembali';
  const g1=kb&&l.pjB?{nama:l.pjB,nip:l.pjBNip,jab:l.pjBJab}:(l.pj?{nama:l.pj,nip:l.pjNip,jab:l.pjJab}:{nama:c.pejabat||'',nip:c.nipPejabat||'',jab:c.jabatan||'Pejabat Pengelola Barang'});
  const P=g1.nama,NP=g1.nip,pj=g1.jab||'Pejabat Pengelola Barang';
  const T=n=>'\u2026'.repeat(n),nn=String(l.no||1).padStart(3,'0');
  const noPinjam=`${nn}/BA-KDN/${new Date(l.tglPinjam).getFullYear()}`;
  const no=kb?`${nn}/BAP-KDN/${new Date(l.tglKembali).getFullYear()}`:noPinjam;
  const e=$('#ba');e.hidden=false;
  const alt=l.status==='Kembali'?`<button class="b g" onclick="ba('${id}','${kb?'pinjam':'kembali'}')">${kb?'Lihat BA Peminjaman':'Lihat BA Pengembalian'}</button>`:'';
  const para=`<p>Pada hari ini, ${fd(kb?l.tglKembali:l.tglPinjam,1)}, bertempat di ${esc(c.kota||'Jayapura')}, yang bertanda tangan di bawah ini:</p>
  <table><tr><td>Nama</td><td>: ${esc(P||T(11))}</td></tr><tr><td>NIP</td><td>: ${esc(NP||T(11))}</td></tr><tr><td>Jabatan</td><td>: ${esc(pj)} (<b>PIHAK PERTAMA</b>)</td></tr></table>
  <table><tr><td>Nama</td><td>: ${esc(l.peminjam)}</td></tr><tr><td>NIP / NIM</td><td>: ${esc(l.nip||'-')}</td></tr><tr><td>Unit / Jurusan</td><td>: ${esc(l.unit||'-')} (<b>PIHAK KEDUA</b>)</td></tr></table>`;
  const kend=`<tr><td>Jenis / merek</td><td>: ${esc(v.nama)}</td></tr><tr><td>Nomor polisi</td><td>: ${esc(v.plat)}</td></tr><tr><td>Tahun</td><td>: ${esc(v.tahun||'-')}</td></tr><tr><td>Pengemudi</td><td>: ${esc(l.driver||l.peminjam)}</td></tr><tr><td>Keperluan</td><td>: ${esc(l.tujuan)}</td></tr>`;
  let isi;
  if(!kb){
    isi=`<p>Pihak Pertama menyerahkan kepada Pihak Kedua kendaraan dinas roda 4 dengan data berikut:</p>
  <table>${kend}<tr><td>Periode pakai</td><td>: ${fd(l.tglPinjam)} s.d. ${fd(l.tglRencana)}</td></tr><tr><td>Km awal</td><td>: ${nf(l.kmAwal)} km</td></tr><tr><td>Kondisi diserahkan</td><td>: ${esc(l.kondisi)}</td></tr></table>
  <p>Pihak Kedua menyatakan bersedia:</p><ol><li>Menggunakan kendaraan hanya untuk kepentingan dinas sesuai keperluan di atas;</li><li>Menjaga, merawat, dan memelihara kendaraan serta kelengkapannya;</li><li>Menanggung kerusakan atau kehilangan yang timbul akibat kelalaian selama penggunaan;</li><li>Mengembalikan kendaraan tepat waktu dalam kondisi baik.</li></ol>
  <p>Demikian berita acara ini dibuat dengan sebenarnya untuk dipergunakan sebagaimana mestinya.</p>`;
  }else{
    isi=`<p>Pihak Kedua telah mengembalikan kepada Pihak Pertama kendaraan dinas roda 4 yang dipinjam berdasarkan Berita Acara Peminjaman Nomor ${noPinjam}, dengan data berikut:</p>
  <table>${kend}<tr><td>Tanggal pinjam</td><td>: ${fd(l.tglPinjam)}</td></tr><tr><td>Rencana kembali</td><td>: ${fd(l.tglRencana)}</td></tr><tr><td>Tanggal kembali</td><td>: ${fd(l.tglKembali)}</td></tr><tr><td>Km awal</td><td>: ${nf(l.kmAwal)} km</td></tr><tr><td>Km akhir</td><td>: ${nf(l.kmAkhir)} km</td></tr><tr><td>Jarak tempuh</td><td>: ${nf(l.kmAkhir-l.kmAwal)} km</td></tr><tr><td>Kondisi saat diserahkan</td><td>: ${esc(l.kondisi)}</td></tr><tr><td>Kondisi saat dikembalikan</td><td>: ${esc(l.kondisiBalik)}</td></tr></table>
  <p>Pihak Pertama telah memeriksa dan menerima kembali kendaraan tersebut beserta kelengkapannya sesuai kondisi di atas. Sejak berita acara ini ditandatangani, kendaraan kembali berada dalam penguasaan Pihak Pertama.</p>
  <p>Demikian berita acara ini dibuat dengan sebenarnya untuk dipergunakan sebagaimana mestinya.</p>`;
  }
  e.innerHTML=`<div class="tool"><button class="b" onclick="window.print()">Cetak / simpan PDF</button>${alt}${can()?`<button class="b g" onclick="ttd('${id}','${kb?'kembali':'pinjam'}')">Atur penandatangan</button>`:''}<button class="b g" onclick="$('#ba').hidden=true">Tutup</button></div>
  <div class="paper"><div class="kop"><img src="${KOP}" alt="Kop Politeknik Kesehatan Kemenkes Jayapura"></div>
  <h3>BERITA ACARA ${kb?'PENGEMBALIAN':'PEMINJAMAN'} KENDARAAN DINAS</h3><div class="nm">Nomor: ${no}</div>
  ${para}${isi}
  <div class="sig"><div>PIHAK KEDUA<br>${kb?'Yang mengembalikan,':'Peminjam,'}<br><br><br><br><u>${esc(l.peminjam)}</u><br>${l.nip?'NIP/NIM. '+esc(l.nip):''}</div><div>PIHAK PERTAMA<br>${kb?'Yang menerima, ':''}${esc(pj)},<br><br><br><br><u>${esc(P||T(8))}</u><br>${NP?'NIP. '+esc(NP):''}</div></div></div>`;
}
function ttd(id,jenis){
  const l=D.l.find(x=>x.id===id),kb=jenis==='kembali';
  const cur=kb&&l.pjB?{nama:l.pjB,nip:l.pjBNip,jab:l.pjBJab}:{nama:l.pj,nip:l.pjNip,jab:l.pjJab};
  $('#ba').innerHTML=`<div class="tool"><button class="b g" onclick="ba('${id}','${jenis}')">Kembali</button></div><div style="max-width:760px;margin:auto"><h2>Atur penandatangan</h2><div class="card"><div class="mut">Pilih petugas yang menandatangani sebagai Pihak Pertama pada BA ${kb?'Pengembalian':'Peminjaman'} ini. Pilih "Pejabat lain / pengganti" jika petugas tetap berhalangan.</div><label>Pihak Pertama</label>${selPetugas('q3',cur)}<div class="acts"><button class="b" onclick="sTtd('${id}','${jenis}')">Simpan</button><button class="b g" onclick="ba('${id}','${jenis}')">Batal</button></div></div></div>`;
  petChg('q3');
}
async function sTtd(id,jenis){
  const pt=petVal('q3');if(!pt)return;
  const l=D.l.find(x=>x.id===id),kb=jenis==='kembali';
  const baru=Object.assign({},l,kb?{pjB:pt.nama,pjBNip:pt.nip,pjBJab:pt.jab}:{pj:pt.nama,pjNip:pt.nip,pjJab:pt.jab});
  try{await run(()=>put('Peminjaman',baru,'l'));ba(id,jenis)}catch(e){}
}

/* ---- Kendaraan ---- */
function rUnit(){
  return`<div class="top"><h2 style="margin:0">Kendaraan dinas</h2>${canU()?'<button class="b" onclick="fUnit()">+ Tambah</button>':''}</div>`+
  (D.v.length?D.v.map(v=>`<div class="card"><div class="vrow">${fp(v)}<div class="vb"><div class="row"><div><div class="plat">${esc(v.plat)}</div><div class="mut">${esc(v.nama)} \u00b7 ${esc(v.tahun||'-')}</div></div><span class="tag ${free(v)?'ok':'warn'}">${free(v)?'Tersedia':'Dipinjam'}</span></div>
  <div class="mut">Pemakai: ${esc(v.unit||'-')}</div><div class="mut">Km ${nf(v.km)} \u00b7 servis tiap ${nf(v.intKm)} km / ${esc(v.intBln)} bulan</div>${v.noRangka?'<div class="mut">Rangka '+esc(v.noRangka)+' \u00b7 Mesin '+esc(v.noMesin)+'</div>':''}${v.fotoTgl?'<div class="mut">Foto diperbarui '+fd(v.fotoTgl)+'</div>':''}${lkSum(v)}${actU(v)}</div></div></div>`).join(''):'<div class="empty">Belum ada kendaraan.</div>');
}

/* ---- Perlengkapan kendaraan ---- */
const LK_DEF=['Ban serep','Dongkrak','Kunci roda','Segitiga pengaman','Kotak P3K','APAR','Buku manual & service','Kunci cadangan'];
const lkGet=v=>{try{const a=JSON.parse(v.lengkap||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}};
const lkSum=v=>{const a=lkGet(v);if(!a.length)return'';const ok=a.filter(x=>x.s==='ada').length;return`<div class="mut">Perlengkapan: ${ok}/${a.length} ada, baik${a.some(x=>x.s==='rusak')?' \u00b7 ada yang rusak':''}</div>`};
let lk=[],lkVid='';
function lkOpen(id){const v=V(id);lkVid=id;lk=lkGet(v);if(!lk.length)lk=LK_DEF.map(n=>({n,s:'ada',c:'',f:''}));lkRender()}
function lkSet(i,k,val){lk[i][k]=val}
function lkPick(i,inp){if(inp.files.length){lk[i]._f=inp.files[0];const b=$('#lp'+i);b.innerHTML='';const im=document.createElement('img');im.src=URL.createObjectURL(lk[i]._f);b.appendChild(im)}inp.value=''}
function lkDel(i){if(!confirm('Hapus item "'+lk[i].n+'" dari daftar?'))return;lk.splice(i,1);lkRender()}
function lkAdd(){const n=($('#lkn').value||'').trim();if(!n)return;lk.push({n,s:'ada',c:'',f:''});lkRender()}
function lkRender(){
  const v=V(lkVid),ST=[['ada','Ada, baik'],['rusak','Ada, rusak'],['tidak','Tidak ada']];
  let h=`<h2>Perlengkapan \u00b7 ${esc(v.plat)}</h2><div class="card"><div class="mut">Catat kelengkapan kendaraan. Foto bersifat opsional (disarankan untuk ban serep, dongkrak, kunci roda). Foto lama tetap tersimpan di Drive.</div></div>`;
  lk.forEach((x,i)=>{
    h+=`<div class="card"><b>${esc(x.n)}</b><label>Status</label><select onchange="lkSet(${i},'s',this.value)">${ST.map(o=>`<option value="${o[0]}"${x.s===o[0]?' selected':''}>${o[1]}</option>`).join('')}</select>`
     +`<label>Catatan</label><input value="${esc(x.c||'')}" onchange="lkSet(${i},'c',this.value)">`
     +`<div class="pv" id="lp${i}">${x._f?'':(x.f?`<img data-fid="${esc(x.f)}" alt="">`:'Belum ada foto')}</div>`
     +`<input type="file" accept="image/*" onchange="lkPick(${i},this)"><div class="acts"><button class="b d" onclick="lkDel(${i})">Hapus item</button></div></div>`;
  });
  h+=`<div class="card"><label>Tambah item</label><input id="lkn" placeholder="mis. Rantai ban, Tali derek"><div class="acts"><button class="b g" onclick="lkAdd()">+ Tambah</button></div></div>`
   +`<div class="acts"><button class="b" onclick="lkSave()">Simpan</button><button class="b g" onclick="render()">Batal</button></div>`;
  $('#m').innerHTML=h;loadImgs();
  lk.forEach((x,i)=>{if(x._f){const b=$('#lp'+i),im=document.createElement('img');im.src=URL.createObjectURL(x._f);b.innerHTML='';b.appendChild(im)}});
}
async function lkSave(){
  const v=V(lkVid),tg=today();
  try{
    await run(async function(){
      const nb=lk.filter(x=>x._f).length;let n=0;
      for(const x of lk){if(!x._f)continue;n++;busy(1,'Mengunggah foto '+n+'/'+nb+'...');
        x.f=await gs('uploadFoto',await shrink(x._f),v.plat.replace(/\s/g,'_')+'_'+x.n.replace(/\W+/g,'_')+'_'+tg+'.jpg','image/jpeg');delete x._f}
      busy(1,'Menyimpan...');
      await put('Kendaraan',Object.assign({},v,{lengkap:JSON.stringify(lk.map(x=>({n:x.n,s:x.s,c:x.c||'',f:x.f||''})))}),'v');
    });
    render();
  }catch(e){}
}
let fotoBaru={};
function pickSide(k,inp){
  if(inp.files.length)fotoBaru[k]=inp.files[0];
  inp.value='';
  var f=fotoBaru[k],box=$('#pv'+k);
  if(f)box.innerHTML='<img src=\''+URL.createObjectURL(f)+'\'>';
}
function fFoto(id){
  var v=V(id),cur=fotos(v);fotoBaru={};
  var h='<h2>Foto kendaraan \u00b7 '+esc(v.plat)+'</h2><div class=\'card\'><div class=\'mut\'>Ambil foto dari 4 sisi agar kendaraan mudah dikenali. Cukup isi sisi yang ingin diganti atau ditambah; sisi lain tetap. Foto lama tetap tersimpan di Drive.'+(v.fotoTgl?' Terakhir diperbarui '+fd(v.fotoTgl)+'.':'')+'</div><div class=\'sisi\'>';
  SISI.forEach(function(n,k){
    h+='<div><label>'+n+'</label><div class=\'pv\' id=\'pv'+k+'\'>'+(cur[k]?'<img data-fid=\''+esc(cur[k])+'\' alt=\''+n+'\'>':'Belum ada')+'</div>'
      +'<input type=\'file\' accept=\'image/*\' onchange=\'pickSide('+k+',this)\'></div>';
  });
  h+='</div><div class=\'acts\'><button class=\'b\' data-i=\''+id+'\' onclick=\'sFoto(this.dataset.i)\'>Simpan foto</button><button class=\'b g\' onclick=\'render()\'>Batal</button></div></div>';
  $('#m').innerHTML=h;loadImgs();
}
async function sFoto(id){
  var ks=Object.keys(fotoBaru);
  if(!ks.length){alert('Pilih minimal satu foto terlebih dahulu.');return}
  var v=V(id),arr=fotos(v),tg=today();
  try{
    await run(async function(){
      for(var n=0;n<ks.length;n++){
        var k=+ks[n];
        busy(1,'Mengunggah foto '+SISI[k].toLowerCase()+' ('+(n+1)+'/'+ks.length+')...');
        arr[k]=await gs('uploadFoto',await shrink(fotoBaru[k]),v.plat.replace(/\s/g,'_')+'_'+SISI[k].toLowerCase()+'_'+tg+'.jpg','image/jpeg');
      }
      busy(1,'Menyimpan...');
      await put('Kendaraan',Object.assign({},v,{foto:arr.join(','),fotoTgl:tg}),'v');
    });
    fotoBaru={};render();
  }catch(e){}
}
function fUnit(id){
  const v=D.v.find(x=>x.id===id)||{nama:'',plat:'',tahun:'',km:0,intKm:5000,intBln:6,unit:'',tglServis:today()};edit=id||null;
  $('#m').innerHTML=`<h2>${id?'Ubah':'Tambah'} kendaraan</h2><div class="card"><label>Merek / tipe</label><input id="u1" value="${esc(v.nama)}" placeholder="Toyota Hilux Double Cabin">
  <div class="g2"><div><label>Nomor polisi</label><input id="u2" value="${esc(v.plat)}" placeholder="PA 1234 AB"></div><div><label>Tahun</label><input id="u3" type="number" value="${esc(v.tahun)}"></div></div>
  <label>Kilometer saat ini</label><input id="u4" type="number" value="${esc(v.km)}">
  <label>Unit pemakai</label><input id="u8" value="${esc(v.unit)}"><div class="g2"><div><label>Interval servis (km)</label><input id="u5" type="number" value="${esc(v.intKm)}"></div><div><label>Interval servis (bulan)</label><input id="u6" type="number" value="${esc(v.intBln)}"></div></div>
  ${id?'':`<label>Tanggal servis terakhir</label><input id="u7" type="date" value="${esc(v.tglServis)}">`}
  <div class="acts"><button class="b" onclick="sUnit()">Simpan</button><button class="b g" onclick="render()">Batal</button></div></div>`;
}
async function sUnit(){
  const g=i=>$(i).value,o={nama:g('#u1'),plat:g('#u2').toUpperCase(),tahun:g('#u3'),km:g('#u4')||0,intKm:g('#u5')||5000,intBln:g('#u6')||6,unit:g('#u8')};
  if(!o.nama||!o.plat){alert('Isi merek dan nomor polisi.');return}
  const base=edit?V(edit):{id:uid(),kmAwal:o.km,tglServis:(edit===null&&$('#u7')?$('#u7').value:'')||today()};
  try{await run(()=>put('Kendaraan',Object.assign({},base,o),'v'));render()}catch(e){}
}
async function delV(id){if(!confirm('Hapus kendaraan beserta riwayat servis dan peminjamannya?'))return;await run(()=>gs('remove','Kendaraan',id));D.v=D.v.filter(v=>v.id!==id);D.s=D.s.filter(s=>s.vid!==id);D.l=D.l.filter(l=>l.vid!==id);render()}

/* ---- Pengguna (admin) ---- */
function rUser(){
  const PR={pj:'PJ kendaraan',bmn:'Operator BMN',peminjam:'Peminjam',admin:'Admin'};
  return`<h2>Tambah / ubah pengguna</h2><div class="card"><label>Username</label><input id="n1" autocapitalize="none" placeholder="mis. pj.kendaraan">
  <label>Nama</label><input id="n2">
  <label>Peran</label><select id="n3"><option value="pj">PJ kendaraan (kelola servis, kendaraan, pengembalian)</option><option value="bmn">Operator BMN (kelola data &amp; foto kendaraan)</option><option value="peminjam">Peminjam (ajukan peminjaman)</option><option value="admin">Admin</option></select>
  <label>Kata sandi (min. 8 karakter)</label><input id="n4" type="password" autocomplete="new-password" placeholder="Kosongkan saat mengubah jika sandi tidak diganti">
  <div class="acts"><button class="b" onclick="sUser()">Simpan pengguna</button></div></div><h2>Daftar pengguna</h2>`+
  (D.u.map(u=>`<div class="card"><div class="row"><div><b>${esc(u.nama)}</b><div class="mut">${esc(u.email)}${u.adaSandi?'':' \u00b7 belum ada kata sandi'}</div></div><span class="tag ok">${esc(PR[u.peran]||u.peran)}</span></div><div class="acts"><button class="b g" onclick="fillU('${esc(u.email)}')">Ubah / atur sandi</button><button class="b d" onclick="delU('${esc(u.email)}')">Hapus</button></div></div>`).join('')||'<div class="empty">Belum ada pengguna.</div>')+
  '<p class="mut">Semua pengguna harus didaftarkan di sini. Berikan username dan kata sandi awal secara langsung; pengguna dapat menggantinya lewat tombol "Ganti sandi".</p>';
}
function fillU(e){const u=D.u.find(x=>x.email===e);if(!u)return;$('#n1').value=u.email;$('#n2').value=u.nama;$('#n3').value=u.peran;$('#n4').value='';window.scrollTo(0,0);$('#n4').focus()}
async function sUser(){const e=$('#n1').value.trim().toLowerCase();if(!e){alert('Isi username.');return}try{await run(()=>put('Pengguna',{email:e,nama:$('#n2').value||e,peran:$('#n3').value,sandi:$('#n4').value},'u'));render()}catch(x){}}
async function delU(e){if(!confirm('Hapus pengguna ini?'))return;await run(()=>gs('remove','Pengguna',e));D.u=D.u.filter(u=>u.email!==e);render()}

init();
</script>
</body>
</html>
